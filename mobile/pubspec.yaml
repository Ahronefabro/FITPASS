name: fitpass
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  qr_flutter: ^4.1.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.4
  flutter_local_notifications: ^22.3.3
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/landing.jpg
    - assets/logo.png
    - assets/bg.png

# The FitPass logo as the app icon on every platform. Sources are built from
# assets/logo.png at its original proportions; regenerate after changing them:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "#1B1B1B"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#1B1B1B"
    theme_color: "#1B1B1B"
